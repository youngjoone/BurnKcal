spring.application.name=BurnKcal
spring.config.import=optional:file:./.env[.properties]
server.address=${SERVER_ADDRESS:0.0.0.0}
server.port=${SERVER_PORT:8080}
spring.servlet.multipart.max-file-size=5MB
spring.servlet.multipart.max-request-size=6MB
server.error.include-message=never
server.error.include-stacktrace=never
burnkcal.allowed-origins=${ALLOWED_ORIGINS:http://localhost:8081,http://127.0.0.1:8081}
burnkcal.analysis-mode=${BURNKCAL_ANALYSIS_MODE:demo}
burnkcal.gemini.api-key=${GEMINI_API_KEY:}
burnkcal.gemini.model=${GEMINI_MODEL:gemini-3.1-flash-lite}
